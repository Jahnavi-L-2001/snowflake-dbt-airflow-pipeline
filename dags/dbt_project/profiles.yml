default:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: /usr/local/airflow/include/keys/rsa_key.p8
      role: ACCOUNTADMIN
      warehouse: DBT_WH
      database: ANALYTICS_DB
      schema: ANALYTICS
      threads: 4